spring.application.name=veterinaria-backend
server.port=8080

# Configuración MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (Crea las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar temporalmente la seguridad para poder usar Swagger libremente en Fase 2
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
