spring.application.name=veterinaria-backend
server.port=8080

# Configuración MySQL local (crea la BD si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (clave de demostración para desarrollo local; no usar secretos reales en repos/videos)
jwt.secret=VeterinariaSanMarcosClaveSuperSecretaParaDesarrolloLocal2026Duoc
jwt.expiration-ms=86400000