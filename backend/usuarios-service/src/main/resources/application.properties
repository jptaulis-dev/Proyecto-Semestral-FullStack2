spring.application.name=veterinaria-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_san_marcos?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT: en produccion se define la variable de entorno JWT_SECRET
jwt.secret=${JWT_SECRET:VeterinariaSanMarcosClaveSuperSecretaParaDesarrolloLocal2026Duoc}
jwt.expiration-ms=86400000
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
server.error.include-message=always
server.error.include-binding-errors=always